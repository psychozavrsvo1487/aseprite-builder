name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download Skia m124
        shell: pwsh
        run: |
          curl.exe -L -o skia.zip https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
          Expand-Archive -Path skia.zip -DestinationPath "$env:GITHUB_WORKSPACE/skia"

      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: v1.3.9.1
          submodules: recursive
          path: aseprite

      - name: Configure and Build Aseprite
        shell: pwsh
        run: |
          cd aseprite
          mkdir build
          cd build
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$env:GITHUB_WORKSPACE/skia" `
            -DSKIA_LIBRARY_DIR="$env:GITHUB_WORKSPACE/skia/out/Release-x64" `
            -DSKIA_LIBRARY="$env:GITHUB_WORKSPACE/skia/out/Release-x64/skia.lib" `
            ..
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ninja aseprite
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload Compiled Aseprite
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: aseprite/build/bin/*
